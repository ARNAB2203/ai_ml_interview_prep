name: AI quality gate

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  baseline-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install baseline dependencies
        run: python -m pip install --requirement examples/requirements.txt
      - name: Run deterministic examples
        run: python examples/run_all.py
      - name: Run baseline contracts
        run: python -m unittest discover -s examples/tests -v

  review-checklist:
    runs-on: ubuntu-latest
    steps:
      - name: Guardrail reminder
        run: |
          echo "Review model/prompt/index/data versions, evaluation slices, tenant isolation, cost, rollback, and sensitive-data handling."
